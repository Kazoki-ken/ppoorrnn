<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jable Video Yuklash</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; text-align: center; }
        input[type="text"] { width: 80%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; }
        select { width: 85%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; }
        button { padding: 10px 20px; background-color: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; margin-top: 10px;}
        button:hover { background-color: #218838; }
        .message { padding: 10px; margin-bottom: 20px; border-radius: 5px; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
        .nav { margin-bottom: 20px; }
        .nav a { margin: 0 10px; text-decoration: none; color: #007bff; font-weight: bold; }
    </style>
</head>
<body>
    <div class="nav">
        <a href="/">Bosh sahifa</a>
        <a href="/list">Yuklanganlar</a>
    </div>

    <h1>JableTV Video Yuklash</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="message {{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST">
        <input type="text" name="video_url" placeholder="Jable video linkini tashlang (masalan: https://jable.tv/videos/...)" required>
        <br>
        <label for="encode_option">Formatlash turi:</label>
        <select name="encode_option" id="encode_option">
            <option value="0">Formatlashsiz (Tezkor)</option>
            <option value="1">mp4 ga aylantirish (Tavsiya)</option>
            <option value="3">CPU orqali (Sekinroq)</option>
            <option value="2">GPU orqali (Nvidia kerak)</option>
        </select>
        <br>
        <button type="submit">Yuklashni Boshlash</button>
    </form>

    <p><small>Jarayon orqa fonda ketadi. Terminalni kuzatishingiz mumkin.</small></p>
</body>
</html>
